server {
    listen 80;
    server_name auth.certcbnu.kr frappecentral.certcbnu.kr wg.certcbnu.kr homarr.certcbnu.kr home.certcbnu.kr docmost.certcbnu.kr learning.certcbnu.kr seminar.certcbnu.kr wiki.certcbnu.kr;
    return 301 https://$host$request_uri;
}

# CUPS는 포트 631을 유지하므로 별도 리다이렉트
server {
    listen 80;
    server_name print.certcbnu.kr;
    return 301 https://$host:631$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.certcbnu.kr;

    ssl_certificate /etc/nginx/certs/live/certcbnu.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/certcbnu.kr/privkey.pem;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;

    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name frappecentral.certcbnu.kr;

    ssl_certificate /etc/nginx/certs/live/certcbnu.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/certcbnu.kr/privkey.pem;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;

    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $frappe_upstream frappe-frontend:8080;
        proxy_pass http://$frappe_upstream;
        
        # 1. $host 변수 대신 실제 도메인 명을 직접 박아넣습니다.
        proxy_set_header Host frappecentral.certcbnu.kr;
        proxy_set_header X-Frappe-Site-Name frappecentral.certcbnu.kr;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 2. https 문자열 대신 $scheme 변수를 사용하는 것이 더 유연하고 표준적입니다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.IO) 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

