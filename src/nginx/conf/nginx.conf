server {
    listen 631 ssl;
    server_name print.certcbnu.kr;

    ssl_certificate /etc/nginx/certs/live/certcbnu.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/certcbnu.kr/privkey.pem;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;

    location / {
        proxy_pass http://172.25.0.1:631;
        # CUPS는 Host가 localhost여야 프린트 잡을 수락함
        proxy_set_header Host "localhost:631";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # CUPS 인증 헤더 전달 (필수)
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # 대용량 프린트 잡 처리를 위한 설정 (IPP 바이너리 데이터)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        client_max_body_size 50m;
    }
}

